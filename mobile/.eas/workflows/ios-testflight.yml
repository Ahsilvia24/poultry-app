name: iOS TestFlight

# Uses type: submit (works on Expo free plan).
# type: testflight with build_id requires a paid Expo plan.

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
