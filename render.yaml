# One-click production host on Render (free web + Postgres).
# Open: https://render.com/deploy?repo=https://github.com/Ahsilvia24/poultry-app
databases:
  - name: poultrytech-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: poultrytech
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: poultrytech-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_DEV_BYPASS
        value: "false"
