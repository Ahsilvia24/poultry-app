<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3efe6" />
    <title>PoultryTech</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f3efe6;
        color: #1c1917;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        padding: 2rem;
        border: 1px solid #e7e5e4;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
      }
      h1 {
        margin: 0;
        text-align: center;
        font-size: 1.25rem;
        color: #064e3b;
      }
      p.note {
        margin: 12px 0 0;
        text-align: center;
        font-size: 0.875rem;
        color: #57534e;
      }
      a {
        color: #065f46;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>PoultryTech</h1>
        <p class="note">Signed out. Farms stay on this phone. Sign in with the same email to open them.</p>
        <p class="note"><a href="/login">Sign in</a></p>
      </div>
    </main>
    <script>
      // One sign-in on /login (local account + cookie). Do not collect a
      // password here — the old server login form failed and sent people to
      // type it again.
      window.location.replace("/login");
    </script>
  </body>
</html>
