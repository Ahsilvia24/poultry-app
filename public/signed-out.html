<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3efe6" />
    <title>PoultryTech</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f3efe6;
        color: #1c1917;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        padding: 2rem;
        border: 1px solid #e7e5e4;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
      }
      h1 {
        margin: 0;
        text-align: center;
        font-size: 1.25rem;
        color: #064e3b;
      }
      p.note {
        margin: 12px 0 0;
        text-align: center;
        font-size: 0.875rem;
        color: #57534e;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.6rem 0.7rem;
        border: 1px solid #d6d3d1;
        border-radius: 0.6rem;
        font: inherit;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        margin-top: 1.25rem;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.6rem;
        background: #065f46;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.6;
      }
      .err {
        margin-top: 0.75rem;
        color: #b91c1c;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .warn {
        margin-top: 0.75rem;
        color: #78350f;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>PoultryTech</h1>
        <p class="note">Signed out of this phone.</p>
        <form id="login">
          <label>Email <input id="email" name="email" type="email" required autocomplete="email" /></label>
          <label>Password <input id="password" name="password" type="password" required autocomplete="current-password" /></label>
          <p id="warn" class="warn" hidden></p>
          <p id="err" class="err" hidden></p>
          <button id="submit" type="submit">Sign in</button>
        </form>
      </div>
    </main>
    <script>
      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const FLAG = "/__poultrytech-signed-out";
      function deviceId() {
        try {
          const existing = localStorage.getItem("pt-device-id");
          if (typeof existing === "string" && UUID_RE.test(existing)) return existing;
          const next = crypto.randomUUID();
          localStorage.setItem("pt-device-id", next);
          return next;
        } catch {
          return crypto.randomUUID();
        }
      }
      async function clearSignedOut() {
        try { localStorage.removeItem("poultrytech-signed-out"); } catch (e) {}
        if (!("caches" in window)) return;
        const keys = await caches.keys();
        await Promise.all(
          keys
            .filter((key) => key.indexOf("poultrytech-offline-") === 0)
            .map(async (key) => {
              const cache = await caches.open(key);
              await cache.delete(FLAG);
            }),
        );
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: "sign-in" });
        }
      }
      const form = document.getElementById("login");
      const warn = document.getElementById("warn");
      const err = document.getElementById("err");
      const submit = document.getElementById("submit");
      let confirmReplace = false;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        err.hidden = true;
        submit.disabled = true;
        submit.textContent = "Signing in…";
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              email: document.getElementById("email").value.trim().toLowerCase(),
              password: document.getElementById("password").value,
              confirmReplace: confirmReplace,
              deviceId: deviceId(),
            }),
          });
          const data = await res.json().catch(function () { return {}; });
          if (data.needsConfirm) {
            confirmReplace = true;
            warn.hidden = false;
            warn.textContent = data.unsynced
              ? "This account still has work that has not uploaded on another sign-in. Sign in anyway to continue here."
              : "This account is already signed in somewhere else. Sign in anyway to continue here.";
            submit.disabled = false;
            submit.textContent = "Sign in anyway";
            return;
          }
          if (!res.ok || data.error) {
            err.hidden = false;
            err.textContent = data.error || "Invalid email or password";
            submit.disabled = false;
            submit.textContent = confirmReplace ? "Sign in anyway" : "Sign in";
            return;
          }
          await clearSignedOut();
          window.location.assign("/");
        } catch (e) {
          err.hidden = false;
          err.textContent = "Need Wi-Fi or service to sign in.";
          submit.disabled = false;
          submit.textContent = confirmReplace ? "Sign in anyway" : "Sign in";
        }
      });
    </script>
  </body>
</html>
