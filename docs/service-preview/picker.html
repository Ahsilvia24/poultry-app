<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Service Farm picker</title><style>
:root { --bg:#f5f5f4; --card:#fff; --text:#1c1917; --muted:#78716c; --accent:#065f46; --border:#e7e5e4; }
* { box-sizing: border-box; }
body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background: linear-gradient(180deg,#ecfdf5,#f5f5f4 40%); color:var(--text); }
a { color: var(--accent); }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 28px; margin: 0 0 8px; }
.sub { color: var(--muted); margin-bottom: 24px; }
.grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 14px; }
.card { background:var(--card); border:1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.04); }
.card h2 { margin:0 0 6px; font-size:18px; }
.card p { margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.4; }
.btn { display:inline-block; background:var(--accent); color:#fff !important; text-decoration:none; font-weight:800; padding:10px 14px; border-radius:10px; font-size:14px; }
.btn.secondary { background:#fff; color:var(--accent) !important; border:1px solid var(--accent); margin-left:8px; }
.phone { width: min(390px,100%); margin: 18px auto; background:#111; border-radius: 28px; padding: 12px; }
.phone-inner { background:#fafaf9; border-radius: 22px; overflow:hidden; min-height: 640px; }
.bar { background:#fff; border-bottom:1px solid var(--border); padding:14px 16px; font-weight:800; }
.screen { padding: 14px 16px 28px; }
.chip { display:block; background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; text-decoration:none; color:inherit; }
.chip strong { display:block; font-size:16px; }
.chip span { color:var(--muted); font-size:13px; }
.row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; gap:10px; }
.yn { display:flex; gap:6px; }
.yn b { min-width:48px; text-align:center; padding:7px 8px; border-radius:8px; font-size:11px; }
.yn .yes { background:var(--accent); color:#fff; }
.yn .no { background:#f5f5f4; }
.field { margin:10px 0; }
.field label { display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:4px; }
.field .box { background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-weight:600; }
.section { font-weight:800; margin:18px 0 8px; }
.note { font-size:13px; color:var(--muted); margin-top:18px; }
</style></head><body><div class="wrap">
<a href="index.html">← Preview home</a>
<div class="phone"><div class="phone-inner">
  <div class="bar">← Demo Farm<br/><span style="font-weight:600;font-size:13px;color:#78716c">Service Farm</span></div>
  <div class="screen">
    <div style="font-size:22px;font-weight:800;margin-bottom:4px">Service Farm</div>
    <div style="color:#78716c;margin-bottom:14px">Choose a checklist</div>
    <a class="chip" href="report-ui.html"><strong>Service Report</strong><span>Routine service checklist → visit + PDF</span></a>
    <a class="chip" href="placement-ui.html"><strong>Placement</strong><span>Placement day checklist → visit + PDF</span></a>
    <a class="chip" href="prebrood-ui.html"><strong>Prebrood (48–72 hr)</strong><span>Visit + generator hours + PDF</span></a>
  </div>
</div></div>
</div></body></html>
