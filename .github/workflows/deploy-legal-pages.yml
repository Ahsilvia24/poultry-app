name: Deploy PoultryTech website

on:
  push:
    branches:
      - main
      - cursor/safari-website-e015
    paths:
      - "mobile/**"
      - "docs/privacy.html"
      - "docs/support.html"
      - "docs/app-store/**"
      - "scripts/stage-github-pages.sh"
      - ".github/workflows/deploy-legal-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install and export Expo web
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_BASE_URL: /poultry-app
        run: |
          npm ci
          npx expo export --platform web
      - name: Stage static site
        run: bash scripts/stage-github-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
