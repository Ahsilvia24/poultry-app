name: Deploy App Store legal pages

on:
  push:
    branches: [main]
    paths:
      - "docs/privacy.html"
      - "docs/support.html"
      - "docs/app-store/index.html"
      - ".github/workflows/deploy-legal-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site/privacy _site/support
          cp docs/privacy.html _site/privacy/index.html
          cp docs/support.html _site/support/index.html
          cp docs/app-store/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
